<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoori Portfolio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  overflow:hidden;
  background:black;
  color:white;
}

/* BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background: radial-gradient(circle at 20% 20%, #00f7ff33, transparent 40%),
              radial-gradient(circle at 80% 80%, #6a00ff33, transparent 40%);
  animation:move 6s infinite alternate;
}

@keyframes move{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}

/* SCENES */
.scene{
  position:absolute;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  flex-direction:column;
  opacity:0;
  transform:translateY(40px);
  transition:1s ease;
}

.scene.active{
  opacity:1;
  transform:translateY(0);
}

/* TEXT */
h1{
  font-size:3rem;
  background:linear-gradient(90deg,#00f7ff,#6a00ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  max-width:600px;
  margin-top:15px;
  opacity:0.8;
  line-height:1.6;
}

/* CHARACTER */
.character{
  width:120px;
  height:120px;
  border-radius:50%;
  background:linear-gradient(45deg,#00f7ff,#6a00ff);
  margin-bottom:20px;
  animation:float 2s infinite ease-in-out;
  box-shadow:0 0 30px #00f7ff;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:12px 22px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00f7ff,#6a00ff);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- SCENE 1 -->
<div class="scene active" id="s1">
  <h1>Welcome to Hoori Portfolio</h1>
  <p>A creative digital universe built with imagination, design & code.</p>
  <button class="btn" onclick="next()">Start Experience</button>
</div>

<!-- SCENE 2 -->
<div class="scene" id="s2">
  <div class="character"></div>

  <h1>Shehzadi Hoorain</h1>
  <p id="typing"></p>
</div>

<!-- SCENE 3 -->
<div class="scene" id="s3">
  <h1>What I Do</h1>
  <p>
    I am a Graphic Designer & Web Developer.<br><br>
    I create modern UI designs, brand identities, and futuristic websites
    that feel alive and interactive.
  </p>
</div>

<script>

let scenes = ["s1","s2","s3"];
let index = 0;

function showScene(i){
  scenes.forEach(id=>{
    document.getElementById(id).classList.remove("active");
  });
  document.getElementById(scenes[i]).classList.add("active");
}

/* NEXT BUTTON FLOW */
function next(){
  index++;
  if(index < scenes.length){
    showScene(index);
    if(index === 1) startTyping();
  }
}

/* TYPING ANIMATION (CHARACTER SPEAKING FEEL) */
let text = "Hey! I am Shehzadi Hoorain 👋 I design beautiful digital experiences that speak creativity and innovation.";
let i = 0;

function startTyping(){
  let el = document.getElementById("typing");
  el.innerHTML = "";

  let interval = setInterval(()=>{
    el.innerHTML += text[i];
    i++;

    if(i >= text.length){
      clearInterval(interval);
    }
  },40);
}

</script>

</body>
</html>
